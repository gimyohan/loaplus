services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # 호스트에 포트를 노출하지 않는다 — backend 컨테이너만 Docker 내부 네트워크로
    # (서비스 이름 `postgres`를 호스트명 삼아) 접근하면 되고, 외부에 열어둘 이유가 없다.
    volumes:
      - loaplus_pgdata_prod:/var/lib/postgresql/data

  backend:
    # 이미지는 GitHub Actions 러너에서 빌드해 docker save | ssh docker load로 EC2에 넣는다 —
    # EC2(t3.micro, RAM 1GB)에서 npm ci/tsc 빌드를 돌리면 메모리가 모자란다. 배포는
    # `up -d --no-build`로 이 이름의 이미지를 그대로 쓴다. build는 수동 비상 빌드용으로 남겨둔다.
    image: loaplus-backend:latest
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
    # nginx(호스트)가 localhost:4000으로 리버스 프록시하도록, 루프백에만 바인딩한다 —
    # 0.0.0.0으로 열면 nginx/rate-limit/TLS를 거치지 않고 인터넷에서 4000번 포트로
    # 직접 백엔드를 두드릴 수 있게 되므로 막아둔다.
    ports:
      - "127.0.0.1:4000:4000"
    # Docker의 awslogs 로깅 드라이버로 stdout/stderr를 CloudWatch Logs에 직접 전송한다 —
    # EC2에 별도 에이전트를 안 띄워도 되고, 컨테이너가 재생성돼도(랜덤 컨테이너 ID) 로그 파일
    # 경로를 신경 쓸 필요가 없다. EC2에 붙인 IAM Role이 logs:PutLogEvents 등 권한을 갖고
    # 있어야 한다(별도 자격증명 불필요).
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-northeast-2
        awslogs-group: /loaplus/backend
        awslogs-create-group: "true"
        awslogs-stream: backend

volumes:
  loaplus_pgdata_prod:
