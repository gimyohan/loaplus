services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # 호스트에 포트를 노출하지 않는다 — backend 컨테이너만 Docker 내부 네트워크로
    # (서비스 이름 `postgres`를 호스트명 삼아) 접근하면 되고, 외부에 열어둘 이유가 없다.
    volumes:
      - loaplus_pgdata_prod:/var/lib/postgresql/data

  backend:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
    # nginx(호스트)가 localhost:4000으로 리버스 프록시하도록, 루프백에만 바인딩한다 —
    # 0.0.0.0으로 열면 nginx/rate-limit/TLS를 거치지 않고 인터넷에서 4000번 포트로
    # 직접 백엔드를 두드릴 수 있게 되므로 막아둔다.
    ports:
      - "127.0.0.1:4000:4000"

volumes:
  loaplus_pgdata_prod:
